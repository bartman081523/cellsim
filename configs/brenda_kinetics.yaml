# Kinetische Konstanten für JCVI-syn3A 4DWCM-Reaktionen
#
# QUELLE: BRENDA / SABIO-RK (Stand 2026-08)
#   https://www.brenda-enzymes.org/
#   https://sabiork.h-its.org/
#
# ORGANISMUS-HIERARCHIE (VECTOR_BRENDA_FULL):
#   1. JCVI-syn3A (Mycoplasma genitalium-basiert) — wenn verfügbar
#   2. Mycoplasma genitalium (nächstverwandt) — primäre Quelle
#   3. Mycoplasma pneumoniae — sekundär
#   4. Escherichia coli — Fallback
#   5. Bacillus subtilis — Gram-positive Fallback
#
# Konvention:
#   kcat: 1/s
#   Km:  mM
#   k = kcat / Km  (pseudo-first-order, vereinfacht)
#
# Status-Flags:
#   JCVI_SPECIFIC — direkt aus JCVI-syn3A-Messung (selten)
#   MGENITALIUM   — aus Mycoplasma genitalium (bevorzugt)
#   MPNEUMONIAE   — aus Mycoplasma pneumoniae
#   BRENDA        — aus E. coli (Standard-Fallback)
#   LITERATURE    — aus Review oder Sekundärquelle
#   HYPOTHESE     — Platzhalter, eigene BRENDA-Recherche nötig

glycolysis:
